<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Pharma Connect">
  <defs>
    <linearGradient id="pc-tile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0c4a6e"/>
      <stop offset="0.55" stop-color="#075985"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="pc-glow" cx="0.22" cy="0.16" r="0.75">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#pc-tile)"/>
  <rect width="64" height="64" rx="15" fill="url(#pc-glow)"/>

  <!-- Two capsules crossing = the plus -->
  <g fill="#ffffff">
    <rect x="26" y="11" width="12" height="42" rx="6"/>
    <rect x="11" y="26" width="42" height="12" rx="6"/>
  </g>
</svg>